<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منصة رشيد</title>
<meta name="theme-color" content="#17694A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>

/* Layout: right sidebar + top bar + full-width content; one light visual world (deliberately single-theme) */
:root{
  --bg:#F6F7F5;--w:#FFFFFF;--ink:#14201A;--ink2:#3E4A44;--mute:#6E7A73;--line:#E3E8E4;--line2:#EEF1EE;
  --br:#17694A;--br2:#2C8A63;--brT:#E7F3EC;--red:#C23B32;--redT:#FCEBE9;--amb:#B4690E;--ambT:#FDF2E2;
  --blu:#2364AA;--bluT:#E8F0FA;--vio:#6B4BC2;--vioT:#F0ECFB;
  --c2:#9CCBB3;--ca:#E0A341;--cr:#D9574E;--cb:#5B8FD1;--cv:#9B7FDB;
  --font:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;direction:rtl;line-height:1.5}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:inherit;text-decoration:none}
.app{display:flex;height:100%;min-height:0}
/* sidebar */
.side{width:252px;flex:none;background:var(--w);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px 12px;padding-right:max(12px,env(safe-area-inset-right,0px));overflow-y:auto}
.logo{display:flex;align-items:center;gap:11px;padding:2px 8px 16px;border-bottom:1px solid var(--line2);margin-bottom:8px}
.logo .m{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,var(--br2),var(--br));display:grid;place-items:center;box-shadow:0 4px 10px -4px var(--br)}
.logo b{font-size:16px;display:block;line-height:1.3}.logo span{font-size:11.5px;color:var(--mute)}
.sec{font-size:11px;font-weight:600;color:var(--mute);padding:12px 10px 4px;letter-spacing:.02em}
.nav{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:10px;color:var(--ink2);font-size:14px;font-weight:500;border:0;background:none;width:100%;text-align:right}
.nav:hover{background:var(--line2)}
.nav.on{background:var(--brT);color:var(--br);font-weight:600}
.nav .n{margin-inline-start:auto;font-size:11px;font-weight:700;min-width:22px;height:20px;border-radius:10px;padding:0 6px;display:grid;place-items:center;background:var(--line2);color:var(--ink2)}
.nav .n.r{background:var(--redT);color:var(--red)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 6px 2px;border-top:1px solid var(--line2);border-radius:0;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:right}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.av.s{width:28px;height:28px;font-size:12px}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{height:64px;flex:none;background:var(--w);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;padding-left:max(24px,env(safe-area-inset-left,0px))}
.crumb{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}.crumb b{color:var(--ink);font-weight:600}
.srch{margin-inline-start:auto;width:380px;max-width:40%;height:40px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:0 13px;color:var(--mute);font-size:13px}
.srch kbd{margin-inline-start:auto;font-family:inherit;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:#fff}
.ib{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2);position:relative;background:#fff;flex:none}
.ib .bd{position:absolute;top:-6px;left:-6px;min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;border:2px solid #fff;font-weight:700}
.burger{display:none}
.body{flex:1;min-height:0;overflow-y:auto;padding:24px;padding-left:max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h1{font-size:26px;font-weight:700;line-height:1.25;margin:0;text-wrap:balance}.ph p{color:var(--mute);font-size:14px;margin:3px 0 0}
.ph .acts{margin-inline-start:auto;display:flex;gap:10px;flex-wrap:wrap}
.btn{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:13.5px;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--line2)}
.btn.pri{background:var(--br);border-color:var(--br);color:#fff}.btn.pri:hover{background:#125A3F}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px}
.btn:focus-visible,.nav:focus-visible,.chip:focus-visible{outline:2px solid var(--br);outline-offset:2px}
.card{background:var(--w);border:1px solid var(--line);border-radius:14px;min-width:0}
.ch{display:flex;align-items:center;gap:10px;padding:16px 20px 12px;flex-wrap:wrap}.ch h3{font-size:16px;font-weight:700;margin:0}.ch .s{color:var(--mute);font-size:12.5px}
.ch .r{margin-inline-start:auto;font-size:13px;font-weight:600;color:var(--br);display:flex;align-items:center;gap:4px;background:none;border:0}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{color:var(--br);background:var(--brT)}.t-exp{color:var(--red);background:var(--redT)}.t-soon{color:var(--amb);background:var(--ambT)}.t-info{color:var(--blu);background:var(--bluT)}.t-gray{color:var(--mute);background:var(--line2)}.t-vio{color:var(--vio);background:var(--vioT)}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--mute);text-align:right;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line);white-space:nowrap}
td{font-size:13.5px;padding:10px 14px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:#FAFCFB}
.sub{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.plate{display:inline-flex;flex-direction:column;align-items:center;border:1.5px solid var(--ink);border-radius:6px;padding:1px 9px;font-weight:700;font-size:13px;line-height:1.25;background:#fff}
.plate small{font-size:11px;font-weight:600;letter-spacing:.08em}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .t{display:flex;align-items:center;gap:9px;color:var(--ink2);font-size:13px;font-weight:600}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.kpi b{font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .f{font-size:12px;color:var(--mute)}
.mk{padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:right;border:1px solid var(--line);background:#fff;border-radius:14px}
.mk:hover{border-color:#C9D6CE}
.mk .ico{width:40px;height:40px;border-radius:11px}
.mk b{font-size:22px;display:block;line-height:1.2}
.row{display:flex;gap:18px;flex-wrap:wrap}
.body>*{flex-shrink:0}
.row>*{flex:1 1 360px}
.li{display:flex;align-items:center;gap:12px;padding:11px 20px;border-top:1px solid var(--line2)}
button.li{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:right}
button.li:hover{background:#FAFCFB}
.mini{font-size:12px;color:var(--mute)}
.cb{width:20px;height:20px;border-radius:6px;border:1.8px solid #C5CEC8;flex:none;display:grid;place-items:center;background:#fff;padding:0}
.cb.ok{background:var(--br);border-color:var(--br)}
.bar{height:7px;border-radius:4px;background:var(--line2);overflow:hidden;display:flex}.bar i{display:block;height:100%}
.seg{display:inline-flex;background:var(--line2);border-radius:10px;padding:3px;gap:2px}
.seg button{height:32px;padding:0 14px;border-radius:8px;border:0;background:none;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{height:36px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--ink2)}
.chip.on{border-color:var(--br);background:var(--brT);color:var(--br);font-weight:600}
.chip .c{font-size:11.5px;font-weight:700;color:var(--mute)}.chip.on .c{color:var(--br)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:10px 16px;font-weight:600;font-size:14px;color:var(--mute);border:0;background:none;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--br);border-bottom-color:var(--br)}
.banner{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;font-size:13px;background:var(--bluT);color:var(--ink2)}
.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--mute);font-weight:600}
.inp{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;width:100%}
textarea.inp{height:auto;padding:10px 12px;resize:vertical}
.inp:focus{outline:2px solid var(--brT);border-color:var(--br)}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(20,32,26,.35);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:70px 16px 16px;overflow-y:auto}
.modal{width:min(860px,100%);background:#fff;border-radius:18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);overflow:hidden}
.mh{display:flex;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line2)}.mh b{font-size:19px}
.mb{padding:18px 24px;display:flex;flex-direction:column;gap:14px}
.mf{display:flex;gap:10px;padding:14px 24px;border-top:1px solid var(--line2);background:#FAFBFA;align-items:center;flex-wrap:wrap}
.pop{position:absolute;top:58px;left:76px;width:400px;max-width:calc(100% - 32px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -12px rgba(20,32,26,.25);overflow:hidden;z-index:40}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;font-size:13.5px;z-index:90;box-shadow:0 10px 24px -8px rgba(0,0,0,.35)}
.demo{position:fixed;bottom:max(14px,env(safe-area-inset-bottom,0px));left:max(14px,env(safe-area-inset-left,0px));z-index:60;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;gap:4px;align-items:center;box-shadow:0 8px 20px -10px rgba(0,0,0,.25);font-size:12px}
.demo span{color:var(--mute);padding:0 6px}
.empty{padding:28px;text-align:center;color:var(--mute)}
.stepper{display:flex;align-items:flex-start;overflow-x:auto;padding-bottom:4px}
.stp{flex:1;min-width:110px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;background:none;border:0;padding:0}
.stp .ln{position:absolute;top:17px;left:50%;width:100%;height:3px;background:var(--line);z-index:0}
.stp .ln.ok{background:var(--br)}
.stp .dot{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:#fff;color:var(--mute);border:2px solid var(--line)}
.stp .dot.ok{background:var(--br);color:#fff;border-color:var(--br)}
.stp .dot.cur{color:var(--br);border:3px solid var(--br);box-shadow:0 0 0 5px var(--brT)}
.msg{display:flex;gap:12px}
@media (max-width:1100px){.g5,.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .side{position:fixed;inset:0 0 0 auto;z-index:70;transform:translateX(100%);transition:transform .2s;box-shadow:-20px 0 40px -20px rgba(0,0,0,.3)}
  .side.open{transform:none}
  .side:not(.open){box-shadow:none}
  .wide{grid-column:1/-1}
  .burger{display:grid}
  .srch span.t,.srch kbd{display:none}.srch{width:40px;padding:0;justify-content:center;flex:none;margin-inline-start:auto}
  .g4,.g5,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .body{padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top{padding:0 16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .pop{left:16px}
  .ph h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.lnk:hover{color:var(--br)!important;text-decoration:underline}
/* v2 */
.seg{flex-wrap:wrap}
.ag-team{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ag-team .card{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.ag-team .card.on{border:1.5px solid var(--br);background:var(--brT)}
.rem-box{padding:12px 14px;display:flex;flex-direction:column;gap:10px;border-color:#F0DDBE;background:#FFFCF6}
.rem-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rem-row>.inp:first-of-type{flex:1 1 260px;height:40px}
.rem-row .seg{align-items:center}
.rem-pre{display:flex;gap:6px;flex-wrap:wrap}
.rem-pre .chip{height:30px;font-size:12px;padding:0 10px;border-style:dashed}
.exp-mini{display:flex;align-items:center;gap:6px;padding:8px 14px;flex-wrap:wrap}
.exp-mini>b{font-size:13px;display:flex;align-items:center;gap:6px;margin-inline-end:8px}
.exp-mini button{border:0;background:var(--bg);border-radius:9px;padding:5px 12px;display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--ink2)}
.exp-mini button b{font-size:16px}
.exp-mini button.all{margin-inline-start:auto;background:none;color:var(--br);font-weight:600;align-items:center}
.ag-top{display:flex;align-items:center;gap:20px;padding:14px 20px;flex-wrap:wrap}
.ag-prog{display:flex;align-items:center;gap:14px;flex:1 1 260px}
.ag-sum{display:flex;gap:8px;flex-wrap:wrap}
.ag-sum div{min-width:74px;text-align:center;border-radius:10px;padding:6px 10px;background:var(--bg)}
.ag-sum b{display:block;font-size:20px;line-height:1.2}.ag-sum span{font-size:11.5px;color:var(--mute);font-weight:600}
.ag-sum .red b{color:var(--red)}.ag-sum .grn b{color:var(--br)}.ag-sum .blu b{color:var(--blu)}
.ag-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.ag-col{background:var(--w);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.ag-col header{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line2);font-size:13.5px}
.ag-col header span{font-size:12px;font-weight:700;background:var(--line2);border-radius:20px;padding:1px 9px}
.ag-col.late header{background:var(--redT);color:var(--red)}.ag-col.late{border-color:#F3CFCB}
.ag-col.today header{background:var(--brT);color:var(--br)}.ag-col.today{border:1.5px solid var(--br)}
.ag-col.tom header{background:var(--bluT);color:var(--blu)}
.ag-list{display:flex;flex-direction:column;max-height:430px;overflow-y:auto}
.ag-empty{padding:18px 14px;color:var(--mute);font-size:12.5px;text-align:center}
.ag-it{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-top:1px solid var(--line2)}
.ag-it:first-child{border-top:0}
.ag-it .cb{margin-top:2px}
.ag-ic{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:none;margin-top:2px}
.ag-tx{flex:1;min-width:0;background:none;border:0;padding:0;text-align:right;display:flex;flex-direction:column;gap:2px}
.ag-tx b{font-size:13px;font-weight:600;line-height:1.45}
.ag-tx>span{font-size:11.5px;color:var(--mute);line-height:1.5}
.ag-tx i{font-style:normal;display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tg{font-style:normal;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--line2);color:var(--ink2);display:inline-flex;align-items:center;gap:3px}
.tg.rem{background:var(--ambT);color:var(--amb)}.tg.proc{background:var(--brT);color:var(--br)}.tg.red{background:var(--redT);color:var(--red)}
.ex-grp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ex-grp>b{font-size:13px;min-width:62px}
.ex-all{width:20px;height:20px;border-radius:6px;border:1.8px solid #C5CEC8;background:#fff;display:grid;place-items:center;padding:0}
.ex-all.on{background:var(--br);border-color:var(--br)}
.msgbox{border:1px solid #CDE5D8;background:#F6FBF8;border-radius:12px;padding:12px 14px}
.msgtxt{white-space:pre-line;font-size:13.5px;line-height:1.85;color:var(--ink);background:#fff;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;max-height:340px;overflow:auto}
.tl{display:flex;flex-direction:column}
.tl-i{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl-i:not(:last-child)::before{content:"";position:absolute;right:13px;top:28px;bottom:2px;width:2px;background:var(--line)}
.tl-i.ok:not(:last-child)::before{background:var(--br)}
.tl-d{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mute);flex:none;position:relative;z-index:1}
.tl-i.ok .tl-d{background:var(--br);border-color:var(--br)}
.tl-i.cur .tl-d{border-color:var(--br);color:var(--br);box-shadow:0 0 0 4px var(--brT)}
.tl-i b{font-size:13.5px;font-weight:600}.tl-i.ok b{color:var(--ink2)}.tl-i:not(.ok):not(.cur) b{color:var(--mute)}
.tl-n{margin-top:5px;font-size:12px;background:var(--ambT);color:#7A4A0A;border-radius:8px;padding:5px 8px;display:flex;gap:5px;align-items:flex-start}
.pk{position:relative;cursor:pointer}
.pk input{position:absolute;opacity:0;pointer-events:none}
.pk span{display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;height:100%}
.pk b{font-size:13px}.pk small{font-size:11.5px;color:var(--mute)}
.pk input:checked+span{border-color:var(--br);background:var(--brT)}
.pk input:focus-visible+span{outline:2px solid var(--br)}
@media (max-width:1100px){.ag-board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.ag-board{grid-template-columns:1fr}.ag-team{grid-template-columns:1fr}.ag-list{max-height:none}}

.seg button{white-space:nowrap}
.seg5{display:grid!important;grid-template-columns:repeat(6,1fr);gap:3px;width:100%}
.seg5 button{grid-column:span 2;padding:0 6px}
.seg5 button:nth-child(n+4){grid-column:span 3}

.me{flex-wrap:wrap;row-gap:8px}
.me>div:nth-child(2){flex:1 1 110px}

</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>

  else if(it==='ins'){L=V.filter(v=>f.st==='exp'?['منتهي','ما فيه'].includes(v.ins):f.st==='soon'?v.ins==='قيد التجديد':f.st==='ok'?v.ins==='ساري':f.st==='all'?true:v.ins!=='ساري');title=`تأمين السيارات · ${stTitle(f)}`;cols=['اللوحة','السيارة','المستخدم الفعلي','التأمين'];row=v=>[pl(v),v.m,v.user||'غير محدد',v.ins]}

PAGES.calendar=()=>{const y=ui.cy??TODAY.getFullYear(),mo=ui.cm??TODAY.getMonth();const first=new Date(y,mo,1);const off=first.getDay();const nd=new Date(y,mo+1,0).getDate();const cells=Array.from({length:Math.ceil((off+nd)/7)*7},(_,i)=>i-off+1);
 const showX=ui.calX!==false;const ev={};const add=(d,o)=>{if(!d)return;(ev[d]=ev[d]||[]).push(o)};
 S.tasks.filter(t=>!t.done&&canSeeTask(t)&&(S.me==='r'||(t.kind==='proc'?t.curWho:t.who)===S.me)).forEach(t=>{const who=t.kind==='proc'?t.curWho:t.who;add(t.kind==='proc'?t.curDue:t.due,{t:t.title,c:PEOPLE[who].c,go:(t.kind==='proc'?'proc':'task')+'-'+t.id})});
 if(showX&&S.me!=='k')expRows().filter(r=>r.date&&r.n>=-7&&!['ins'].includes(r.k)).forEach(r=>add(r.date,{t:expLbl(r.k)+' · '+r.owner,c:'',go:r.go,x:1}));
 return `<div class="ph"><div><h1>التقويم</h1><p>${MONN[mo]} ${y} · ${S.me==='r'?'مهام الفريق':'مهامي'}${showX&&S.me!=='k'?' وتواريخ الانتهاء':''}</p></div><div class="acts">${S.me!=='k'?`<button class="chip ${showX?'on':''}" data-act="calx">${ic('alert',15)}تواريخ الانتهاء</button>`:''}${btn('الشهر اللي فات','right','','cal:-1')}${btn('الشهر الجاي','left','','cal:1')}</div></div>
 <section class="card" style="padding:16px;overflow-x:auto"><div style="display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));gap:6px;min-width:660px">${DAYN.map(d=>`<div class="mini" style="text-align:center;font-weight:600">${d}</div>`).join('')}${cells.map(d=>{const ds=d>0&&d<=nd?fmt(new Date(y,mo,d)):'';const isT=ds===fmt(TODAY);const L=ds?(ev[ds]||[]):[];return `<div style="min-height:96px;border-radius:10px;background:${ds?(isT?'var(--brT)':'var(--bg)'):'transparent'};padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0">${ds?`<b style="font-size:12px;${isT?'color:var(--br)':''}">${d}</b>`:''}${L.slice(0,4).map(o=>`<button data-go="${o.go}" title="${esc(o.t)}" style="font-size:11px;font-weight:600;${o.x?'background:#fff;color:var(--amb);border:1px solid #F0DDBE':`background:${o.c};color:#fff;border:0`};border-radius:5px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right">${esc(o.t)}</button>`).join('')}${L.length>4?`<span class="mini">+${L.length-4}</span>`:''}</div>`}).join('')}</div>
 <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:12px" class="mini">${Object.values(PEOPLE).map(p=>`<span style="display:inline-flex;align-items:center;gap:5px"><i style="width:10px;height:10px;border-radius:3px;background:${p.c}"></i>${p.name}</span>`).join('')}${showX&&S.me!=='k'?`<span style="display:inline-flex;align-items:center;gap:5px"><i style="width:10px;height:10px;border-radius:3px;border:1px solid var(--amb)"></i>تاريخ انتهاء</span>`:''}</div></section>`};
/* virtual agenda items: client follow-ups + service steps */
const _agV3=agenda;agenda=function(p){const B=_agV3(p);const put=x=>{const n=x.date?days(x.date):null;(n===null?B.none:n<0?B.late:n===0?B.today:n===1?B.tom:n===2?B.after:n<=7?B.week:B.later).push(x)};
 if(p!=='s'){S.clients.filter(c=>c.owner===p).forEach(c=>{const due=fmt(new Date(D(c.lastTouch).getTime()+c.every*864e5));if(days(due)<=7)put({t:{id:0,co:c.name,emp:''},date:due,title:`تابع مع ${c.name}`,sub:`آخر تواصل ${c.lastTouch} · نحدّثه كل ${c.every} أيام`,kind:'client',go:'client-'+c.id})});
  S.services.filter(s=>s.owner===p&&s.status!=='منجزة'&&s.done<s.steps.length).forEach(s=>{const it=s.stepItems[s.done]||{};const due=iso2(it.NextFollowUp)||s.due;put({t:{id:0,co:s.clientName,emp:''},date:due,title:s.svc,sub:`الخطوة ${s.done+1} من ${s.steps.length}: ${s.steps[s.done]}`,kind:'svc',go:'client-'+s.client})})}
 Object.values(B).forEach(a=>a.sort((a,b)=>(D(a.date)||0)-(D(b.date)||0)));return B};
/* auto refresh + tab title */
let lastLoad=Date.now();
async function softReload(){if(busy||document.getElementById('layer').innerHTML||document.activeElement&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;try{await loadAll();build();lastLoad=Date.now();const y=document.getElementById('main')?.scrollTop||0;render();const m=document.getElementById('main');if(m)m.scrollTop=y}catch(e){console.warn('refresh',e)}}
setInterval(()=>{if(document.visibilityState==='visible'&&S.loaded&&Date.now()-lastLoad>4.5*60e3)softReload()},60e3);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.loaded&&Date.now()-lastLoad>2*60e3)softReload()});
const _renderV3=render;render=function(){_renderV3();if(!S.loaded)return;const n=S.notifs.filter(x=>x.new).length;const B=agenda(S.me);const due=B.late.length+B.today.length;document.title=(n||due?`(${n||due}) `:'')+'منصة رشيد'};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act="calx"]');if(el){ui.calX=ui.calX===false;render()}},true);

/* ===================== boot ===================== */
function splash(msg,btnHtml=''){document.getElementById('app').innerHTML=`<div style="flex:1;display:grid;place-items:center;padding:16px"><div class="card" style="padding:36px 32px;width:min(460px,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px"><span class="logo" style="border:0;padding:0;margin:0"><span class="m" style="width:56px;height:56px">${ic('layers',28,'#fff')}</span></span><h1 style="margin:6px 0 0;font-size:24px">منصة رشيد</h1><p class="mini" style="font-size:14px;margin:0">الموارد البشرية والخدمات</p><div style="margin-top:8px;color:var(--ink2)">${msg}</div>${btnHtml}</div></div>`}
async function boot(reload){
  try{
    if(!reload){const r=await msalApp.handleRedirectPromise();if(r&&r.account)ACC=r.account}
    ACC=ACC||msalApp.getAllAccounts()[0];
    if(!ACC){splash('سجّل دخولك بحساب الشركة',`<button class="btn pri" style="height:46px;padding:0 24px;margin-top:6px" id="login">${ic('user',18)}تسجيل الدخول بحساب مايكروسوفت</button>`);document.getElementById('login').onclick=()=>msalApp.loginRedirect({scopes:SC,prompt:'select_account'});return}
    splash('جاري تحميل البيانات…');
    if(!SITE)SITE=(await G('/sites/'+CFG.sitePath)).id;
    await loadAll();
    const em=(ACC.username||'').toLowerCase();const tm=RAW.Team.find(t=>(t.Email||'').toLowerCase()===em);
    const byMail=em.startsWith('rasheed@')?'r':em.startsWith('sheikha@')?'s':em.startsWith('khalid@')?'k':null;const me=(tm&&(KEY[tm.Title]||KEY[(tm.Title||'').trim().split(' ')[0]]))||byMail;
    if(!me){splash('حسابك ('+esc(ACC.username)+') مب مضاف في «الفريق والصلاحيات». كلّم رشيد يضيفك.',`<button class="btn" data-act="logout" style="margin-top:6px">تسجيل خروج</button>`);return}
    if(!reload){S.realMe=me;S.me=me}
    build();
    if(!reload){autoEngine().then(n=>{if(n){build();render();toast(`بدأت ${n} إجراءات/مهام تلقائياً`)}}).catch(e=>console.warn('auto',e))}
    const h=(location.hash||'').slice(1);go(reload?(location.hash.slice(1)||'home'):(h&&(PAGES[h.replace(/-\d+$/,'')])?h:'home'));
    if(reload)toast('تحدّثت البيانات');
  }catch(e){console.error(e);splash('ما قدرت أحمّل البيانات: '+esc(e.message),`<button class="btn pri" onclick="location.reload()" style="margin-top:6px">حاول مرة ثانية</button>`)}
}
boot();
